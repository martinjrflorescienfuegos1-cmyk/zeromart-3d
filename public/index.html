<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroMart 3D</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: rgba(17, 22, 33, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2f7;
      --muted: #9aa6b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
    }

    .panel {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: min(350px, calc(100vw - 28px));
      max-height: 62vh;
      overflow-y: auto;
      z-index: 10;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-card {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
    }

    .product-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .product-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .price {
      color: #4ade80;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .live-note {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--accent);
      min-height: 22px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud-top">
    <div class="badge">
      <span class="dot"></span>
      <strong>ZeroMart 3D</strong>
      <span class="muted" style="margin:0;">Arrastra para rotar · Clic en producto</span>
    </div>
    <div class="badge" id="status-badge">Conectando...</div>
  </div>

  <aside class="panel">
    <h2>Catálogo en Pasillo</h2>
    <p class="muted" id="selected-info">Selecciona un producto en 3D o en la lista.</p>
    <div class="product-list" id="product-list"></div>
    <div class="live-note" id="live-note">Esperando eventos en tiempo real...</div>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const wrap = document.getElementById("canvas-wrap");
    const listEl = document.getElementById("product-list");
    const selectedInfoEl = document.getElementById("selected-info");
    const liveNoteEl = document.getElementById("live-note");
    const statusBadgeEl = document.getElementById("status-badge");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.Fog(0x0b0e14, 14, 34);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.4, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.04;

    // Iluminación
    scene.add(new THREE.AmbientLight(0xdbeafe, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Piso del pasillo
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x161d2b, roughness: 0.75, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Rejilla sutil de piso
    const grid = new THREE.GridHelper(24, 24, 0x283548, 0x1c2536);
    grid.position.y = 0.01;
    scene.add(grid);

    // Estante 3D central
    const shelfGroup = new THREE.Group();
    const postMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.4, roughness: 0.5 });
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });

    const shelfWidth = 7.2;
    const shelfHeight = 3.2;
    const shelfDepth = 1.1;

    [-shelfWidth / 2 + 0.1, shelfWidth / 2 - 0.1].forEach((xPos) => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, shelfHeight, shelfDepth), postMat);
      post.position.set(xPos, shelfHeight / 2, 0);
      post.castShadow = true;
      shelfGroup.add(post);
    });

    [0.75, 1.75, 2.75].forEach((yPos) => {
      const board = new THREE.Mesh(new THREE.BoxGeometry(shelfWidth, 0.12, shelfDepth), boardMat);
      board.position.set(0, yPos, 0);
      board.castShadow = true;
      board.receiveShadow = true;
      shelfGroup.add(board);
    });

    scene.add(shelfGroup);

    const palette = [0x38bdf8, 0xf59e0b, 0x34d399, 0xa78bfa, 0xf87171];
    const productMeshes = new Map();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let products = [];
    let selectedId = null;

    function selectProduct(id, emitSocket = true) {
      selectedId = id;
      const prod = products.find((p) => String(p.id) === String(id));

      productMeshes.forEach((mesh, key) => {
        const active = String(key) === String(id);
        mesh.scale.setScalar(active ? 1.18 : 1);
        mesh.material.emissive.setHex(active ? 0x1e293b : 0x000000);
      });

      document.querySelectorAll(".product-card").forEach((card) => {
        card.classList.toggle("active", card.dataset.id === String(id));
      });

      if (prod) {
        selectedInfoEl.textContent = `${prod.name} · $${prod.price} MXN · Stock: ${prod.stock} (${prod.aisle})`;
      }

      if (emitSocket && prod) {
        socket.emit("product:select", prod.id);
      }
    }

    function renderList() {
      listEl.innerHTML = "";
      products.forEach((prod) => {
        const card = document.createElement("div");
        card.className = "product-card" + (String(prod.id) === String(selectedId) ? " active" : "");
        card.dataset.id = String(prod.id);
        card.innerHTML = `
          <div class="row">
            <strong>${prod.name}</strong>
            <span class="price">$${prod.price}</span>
          </div>
          <div class="meta">Pasillo: ${prod.aisle} · Stock: ${prod.stock}</div>
        `;
        card.addEventListener("click", () => selectProduct(prod.id, true));
        listEl.appendChild(card);
      });
    }

    function rebuildMeshes() {
      productMeshes.forEach((mesh) => scene.remove(mesh));
      productMeshes.clear();

      const levels = [1.1, 2.1, 3.05];
      products.forEach((prod, idx) => {
        const levelY = levels[idx % levels.length];
        const col = Math.floor(idx / levels.length);
        const xPos = -2.2 + ((idx * 1.45) % 4.6) + (col * 0.25);
        const color = palette[idx % palette.length];

        const box = new THREE.Mesh(
          new THREE.BoxGeometry(0.68, 0.56, 0.56),
          new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15 })
        );
        box.position.set(xPos, levelY, 0.08);
        box.castShadow = true;
        box.userData.productId = prod.id;

        scene.add(box);
        productMeshes.set(prod.id, box);
      });
    }

    function setProducts(nextProducts) {
      products = Array.isArray(nextProducts) ? nextProducts : [];
      rebuildMeshes();
      renderList();
      if (selectedId) {
        selectProduct(selectedId, false);
      }
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(Array.from(productMeshes.values()), false);
      if (hits.length > 0) {
        const hitId = hits[0].object.userData.productId;
        selectProduct(hitId, true);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Carga inicial desde API REST
    fetch("/api/products")
      .then((r) => r.json())
      .then((data) => {
        if (data?.products) setProducts(data.products);
      })
      .catch(() => {});

    // Sincronización en tiempo real con Socket.IO
    const socket = io();
    socket.on("connect", () => {
      statusBadgeEl.textContent = "Online · Socket listo";
    });
    socket.on("disconnect", () => {
      statusBadgeEl.textContent = "Reconectando...";
    });
    socket.on("store:init", (payload) => {
      if (payload?.products) setProducts(payload.products);
    });
    socket.on("product:selected", ({ productId, by }) => {
      const prod = products.find((p) => String(p.id) === String(productId));
      const label = prod ? prod.name : `ID ${productId}`;
      liveNoteEl.textContent = `Selección en vivo: ${label} (${by.slice(0, 6)})`;
    });

    function animate() {
      requestAnimationFrame(animate);
      productMeshes.forEach((mesh) => {
        mesh.rotation.y += 0.006;
      });
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
